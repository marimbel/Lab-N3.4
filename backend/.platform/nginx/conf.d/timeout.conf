# Elastic Beanstalk: nginx sits in front of the Node app and by default gives up
# after 60 seconds (504 Gateway Timeout). Gemini "thinking" models can take longer,
# so allow up to 3 minutes for /api/askanything to answer.
proxy_connect_timeout 60s;
proxy_send_timeout    180s;
proxy_read_timeout    180s;
send_timeout          180s;
